<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <!-- Neo-brutalist badge container -->
  <rect x="24" y="24" width="464" height="464" rx="48" fill="#FFFFFF" stroke="#000000" stroke-width="16" />
  <!-- Shadow accent offset effect inside -->
  <rect x="36" y="36" width="440" height="440" rx="36" fill="none" stroke="#000000" stroke-width="4" stroke-dasharray="12 12" opacity="0.3"/>

  <!-- Food bowl graphic -->
  <path d="M 146 250 C 146 345 366 345 366 250 Z" fill="#FF5C35" stroke="#000000" stroke-width="16" stroke-linejoin="round" />

  <!-- Stylized brutalist fork diagonally cutting across -->
  <g transform="rotate(-35 256 220)">
    <!-- Fork handle -->
    <rect x="244" y="180" width="24" height="150" rx="8" fill="#FFE600" stroke="#000000" stroke-width="12" />
    <!-- Fork head base -->
    <path d="M 230 180 L 282 180 L 274 130 L 238 130 Z" fill="#FFE600" stroke="#000000" stroke-width="12" stroke-linejoin="round" />
    <!-- Fork tines -->
    <rect x="232" y="80" width="8" height="56" rx="4" fill="#FFE600" stroke="#000000" stroke-width="8" />
    <rect x="252" y="80" width="8" height="56" rx="4" fill="#FFE600" stroke="#000000" stroke-width="8" />
    <rect x="272" y="80" width="8" height="56" rx="4" fill="#FFE600" stroke="#000000" stroke-width="8" />
  </g>

  <!-- Neo-brutalist brand text banner -->
  <rect x="80" y="375" width="352" height="72" rx="12" fill="#FFE600" stroke="#000000" stroke-width="12" />
  <text x="256" y="426" text-anchor="middle" font-family="'JetBrains Mono', 'Space Mono', monospace, sans-serif" font-size="44" font-weight="900" letter-spacing="2" fill="#000000">BBD MESS</text>
</svg>
